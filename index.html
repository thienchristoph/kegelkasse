<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111111">
<title>Kegelkasse KC Red Snapper</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--red:#c8102e;--ink:#1d1d1f;--mut:#6b6b70;--line:#e3e3e8;--bg:#f6f6f8;--card:#fff;--ok:#1a7f37}
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#111;color:#fff;padding:10px 14px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
header img{height:40px;background:#fff;border-radius:6px;padding:2px}
header h1{font-size:18px;margin:0;flex:1}
header .role{font-size:13px;background:#333;border:0;color:#fff;padding:8px 10px;border-radius:8px}
#sync{font-size:13px;padding:6px 14px;border-bottom:1px solid var(--line);background:#eef7f0;color:#1a7f37}
#sync.off{background:#fff4d6;color:#6b4e00;border-color:#f0dca0}
nav{display:flex;gap:6px;padding:10px 14px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line)}
nav button{flex:0 0 auto}
main{padding:14px;max-width:1100px;margin:0 auto}
button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;cursor:pointer;color:var(--ink)}
button.pri{background:var(--red);color:#fff;border-color:var(--red)}
button.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
button:disabled{opacity:.4}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.card h2{font-size:17px;margin:0 0 10px}
.mut{color:var(--mut);font-size:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
input,select{font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;min-width:0}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cat{text-align:left;padding:12px;min-height:70px;position:relative;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.cat small{display:block;color:var(--mut)}
.cat .cnt{position:absolute;top:8px;right:10px;background:var(--red);color:#fff;border-radius:999px;padding:0 8px;font-size:13px;font-weight:700}
.cat:active{background:#fde8eb}
.cats.big{grid-template-columns:repeat(2,1fr)}
.cats.big .cat{min-height:100px;font-size:19px;font-weight:600}
@media(min-width:700px){.cats.big{grid-template-columns:repeat(4,1fr)}}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
td.r,th.r{text-align:right}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:#eee}
.pill.offen{background:#e7f0ff;color:#1546a0}.pill.entwurf{background:#fff1d6;color:#7a5200}.pill.final{background:#e3f5e8;color:#1a7f37}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet>div{background:#fff;width:100%;max-width:900px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:10px;z-index:20;font-size:14px}
.hi{background:#fff8e1;border:1px solid #f2d27a;border-radius:10px;padding:10px;margin:10px 0;font-size:15px}
.entries{list-style:none;padding:0;margin:8px 0}
.entries li{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.gridwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px}
table.grid{border-collapse:separate;border-spacing:0;font-size:14px;width:max-content;min-width:100%}
.grid th{font-size:11px;font-weight:600;vertical-align:bottom;width:64px;min-width:64px;padding:6px 3px;background:#fafafa;text-align:center;border-bottom:1px solid var(--line);hyphens:auto}
.grid th small{display:block;color:var(--mut);font-weight:400}
.grid .nm{position:sticky;left:0;background:#fff;z-index:2;min-width:118px;width:118px;text-align:left;font-weight:600;font-size:14px;border-right:1px solid var(--line)}
.grid th.nm{background:#fafafa}
.grid td{padding:0;border-bottom:1px solid var(--line)}
.grid td.nm{padding:0 8px}
.grid td.cell{height:54px;text-align:center;font-size:21px;font-weight:700;border-left:1px solid var(--line);cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.grid td.cell.free{font-size:13px;color:var(--mut)}
.grid td.cell.has{background:#fde8eb;color:var(--red)}
.grid td.cell:active{background:#f6b8c2}
.grid td.sum{padding:0 8px;text-align:right;font-weight:700;white-space:nowrap}
.strip{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;position:sticky;top:60px;background:#fff;z-index:3}
.chip{flex:0 0 auto;padding:8px 12px;border-radius:999px;text-align:center;font-size:15px}
.chip small{display:block;font-size:12px;opacity:.75}
#undo{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#111;color:#fff;border-radius:12px;padding:6px 6px 6px 14px;display:flex;gap:10px;align-items:center;z-index:20;font-size:15px;white-space:nowrap}
#undo button{background:#3a3a3c;color:#fff;border:0;padding:8px 12px}
</style>
</head>
<body>
<header>
  <img src="logo.png" alt="KC Red Snapper">
  <h1>Kegelkasse</h1>
  <button class="role" id="roleBtn">Anmelden</button>
</header>
<div id="sync">Verbinde …</div>
<nav id="nav"></nav>
<main id="main"><div class="card">Lade …</div></main>
<div id="sheet"></div>
<script src="app.js?v=6"></script>
<script>
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
