name: Kalender aktualisieren
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-ics.mjs
      - name: Änderung einchecken
        run: |
          if [ -n "$(git status --porcelain kegeltermine.ics)" ]; then
            git config user.name "Kegelkasse-Bot"
            git config user.email "actions@users.noreply.github.com"
            git add kegeltermine.ics
            git commit -m "Kegeltermine aktualisiert"
            git push
          fi
